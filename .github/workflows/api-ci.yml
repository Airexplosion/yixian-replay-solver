name: API checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.203'
      - run: dotnet build Yx.SolverHost -c Release
      - run: python -m unittest discover -s api -p 'test_*.py'
        env:
          YX_SOLVER_TEST_COMMAND: '["dotnet","Yx.SolverHost/bin/Release/net8.0/Yx.SolverHost.dll"]'
